apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: part2
spec:
  destination:
    namespace: ''
    server: https://kubernetes.default.svc
  source:
    path: argo
    repoURL: https://github.com/arslankhanali/ocpvirt-gitops
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: false
      enabled: true